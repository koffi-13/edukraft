# EduKraft CI — tests automatisés sur chaque push/PR
#
# Jobs :
#   1. server-tests   : E2E backend (Express + SQLite) — test-e2e-selfcontained.js
#   2. contract-tests : Tests Hardhat du smart contract EduKraftBadge (ERC-721)
#
# Les deux jobs tournent en parallèle. Si l'un échoue, la PR est bloquée.
# Node 20 LTS (recommandé pour Expo SDK 50 et better-sqlite3 précompilé).

name: CI

on:
  push:
    branches: [main, feat/phase1-functional]
  pull_request:
    branches: [main, feat/phase1-functional]

jobs:
  server-tests:
    name: Backend E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests (self-contained)
        env:
          JWT_SECRET: ci-test-secret-fixed-for-edukraft
          API_KEY: dev-key
          OTP_MOCK_CODE: '123456'
          PHONE_OTP_ENABLED: 'true'
          POLYGON_MOCK_MODE: 'true'
          PAYMENT_MOCK: 'true'
        run: node test-e2e-selfcontained.js

  contract-tests:
    name: Smart contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test
