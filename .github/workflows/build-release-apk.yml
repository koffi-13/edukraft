# Build APK + Publish to GitHub Releases — SANS EAS
# Déclenché sur tag v* ou manuellement (workflow_dispatch).
#
# Ce workflow :
#   1. Génère le projet natif android/ (expo prebuild --clean)
#   2. Injecte le keystore STABLE versionné dans android-signing/
#      (signature identique à chaque build -> mises à jour sans désinstallation)
#   3. Compile l'APK release avec Gradle directement sur le runner
#   4. Crée une GitHub Release avec l'APK en pièce jointe
#
# ✅ AUCUN secret requis (ni EXPO_TOKEN, ni keystore externe).
#    Le keystore de test est versionné dans android-signing/ — à remplacer par
#    un keystore privé pour une publication Play Store (voir docs/DEPLOYMENT-V1.md).
#
# Une fois le workflow terminé, l'APK est téléchargeable depuis :
#   https://github.com/koffi-13/edukraft/releases

name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v1.1.1)'
        required: true
        default: 'v1.1.1'
  push:
    tags:
      - 'v*'

# Permissions nécessaires pour créer une GitHub Release
permissions:
  contents: write

jobs:
  build:
    name: Build APK (Gradle direct) and Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android (clean)
        run: npx expo prebuild --platform android --clean --no-install

      # Le template Expo signe le build release avec signingConfigs.debug
      # (storeFile android/app/debug.keystore, password 'android',
      #  alias 'androiddebugkey'). On écrase ce fichier par notre keystore
      # stable : signature IDENTIQUE à chaque build -> les APK se mettent à
      # jour par-dessus les versions précédentes sans désinstallation.
      - name: Inject stable signing keystore
        run: |
          cp android-signing/edukraft-release.keystore android/app/debug.keystore
          echo "Keystore injecte (SHA-256 du certificat) :"
          keytool -list -v -keystore android/app/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" || { echo "::error::APK non signé !"; exit 1; }
          echo "APK signé, signature vérifiée."

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "edukraft-${{ steps.version.outputs.VERSION }}.apk"
          ls -lh edukraft-*.apk

      - name: Upload APK (artifact de secours)
        uses: actions/upload-artifact@v4
        with:
          name: edukraft-${{ steps.version.outputs.VERSION }}
          path: edukraft-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: EduKraft ${{ steps.version.outputs.VERSION }}
          body: |
            # EduKraft ${{ steps.version.outputs.VERSION }}

            ## Installation
            1. Téléchargez le fichier APK ci-dessous
            2. Ouvrez-le sur votre téléphone Android
            3. Autorisez "Sources inconnues" si demandé
            4. Ouvrez EduKraft

            ## Nouveautés v1.1.9
            - **Connexion Email + Mot de passe réparée** (correctif majeur) :
              le serveur perdait tous les comptes à chaque redémarrage Render
              (disque éphémère du plan gratuit) — « l'inscription marche mais
              pas la connexion ». La base du serveur est désormais sauvegardée
              automatiquement (snapshot GitHub) et restaurée à chaque
              démarrage : les comptes survivent aux redéploiements.
            - **Vos données ne disparaissent plus après une reconnexion** :
              si le serveur avait recréé votre compte (nouvel identifiant),
              l'app reconnaissait à tort un « changement de compte » et
              repartait d'un profil vide. Désormais, même email = même
              compte : votre objectif du jour, votre photo de profil, vos
              informations et votre XP suivent votre compte, et tout est
              renvoyé au serveur pour vos autres appareils.
            - **Photo de profil affichée** dans l'onglet Profil (et conservée
              sur tous vos appareils) — avant, seule l'initiale du prénom
              apparaissait.
            - **Vérification d'email** : après une connexion ou une
              inscription par email, un code à 6 chiffres vous est envoyé
              pour sécuriser votre compte (non bloquant, « Plus tard »
              possible). Les comptes Google sont considérés vérifiés
              automatiquement.
            - **Objectif du jour conservé** : le réglage (leçons/XP) survit
              aux redémarrages, aux reconnexions et aux effacements serveur.
            - **Connexion Google plus résistante** : l'app réessaie
              automatiquement (jusqu'à ~100 s) pendant le réveil du serveur
              Render — fini le retour silencieux à l'écran de connexion
              « sans aucune activité » sur un téléphone qui se connecte pour
              la première fois de la journée.
          files: edukraft-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
