# Build APK + Publish to GitHub Releases — SANS EAS
# Déclenché sur tag v* ou manuellement (workflow_dispatch).
#
# Ce workflow :
#   1. Génère le projet natif android/ (expo prebuild --clean)
#   2. Injecte le keystore STABLE versionné dans android-signing/
#      (signature identique à chaque build -> mises à jour sans désinstallation)
#   3. Compile l'APK release avec Gradle directement sur le runner
#   4. Attache l'APK à la GitHub Release existante pour ce tag.
#      Si aucune release n'existe encore pour ce tag, en crée une avec
#      le message du commit de tag comme body.
#
# v1.1.17 : le workflow NE CRÉE PLUS de release avec un body hardcodé.
#   Avant, toutes les releases portaient le body stale « Nouveautés v1.1.9 »
#   parce que `body:` était inline et écrasait le body détaillé mis à la main.
#   Désormais, si la release existe déjà (créée via API ou par un bot avec un
#   body détaillé), on se contente d'y attacher l'APK sans toucher au body.
#   Si elle n'existe pas, on la crée en utilisant le message du commit de tag
#   comme body (via `gh release create --notes-from-tag`).
#
# ✅ AUCUN secret requis (ni EXPO_TOKEN, ni keystore externe).
#    Le keystore de test est versionné dans android-signing/ — à remplacer par
#    un keystore privé pour une publication Play Store (voir docs/DEPLOYMENT-V1.md).
#
# Une fois le workflow terminé, l'APK est téléchargeable depuis :
#   https://github.com/koffi-13/edukraft/releases

name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v1.1.17)'
        required: true
        default: 'v1.1.17'
  push:
    tags:
      - 'v*'

# Permissions nécessaires pour attacher un asset à une GitHub Release
permissions:
  contents: write

jobs:
  build:
    name: Build APK (Gradle direct) and Attach to Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android (clean)
        run: npx expo prebuild --platform android --clean --no-install

      # Le template Expo signe le build release avec signingConfigs.debug
      # (storeFile android/app/debug.keystore, password 'android',
      #  alias 'androiddebugkey'). On écrase ce fichier par notre keystore
      # stable : signature IDENTIQUE à chaque build -> les APK se mettent à
      # jour par-dessus les versions précédentes sans désinstallation.
      - name: Inject stable signing keystore
        run: |
          cp android-signing/edukraft-release.keystore android/app/debug.keystore
          echo "Keystore injecte (SHA-256 du certificat) :"
          keytool -list -v -keystore android/app/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" || { echo "::error::APK non signé !"; exit 1; }
          echo "APK signé, signature vérifiée."

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "edukraft-${{ steps.version.outputs.VERSION }}.apk"
          ls -lh edukraft-*.apk

      - name: Upload APK (artifact de secours)
        uses: actions/upload-artifact@v4
        with:
          name: edukraft-${{ steps.version.outputs.VERSION }}
          path: edukraft-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 30

      # v1.1.17 : gestion idempotente de la release.
      # - Si la release existe déjà (créée via API avec un body détaillé
      #   par le bot d'audit), on se contente d'attacher l'APK via
      #   `gh release upload --clobber` — le body EST PRÉSERVÉ.
      # - Si la release n'existe pas encore, on la crée en utilisant le
      #   message du commit de tag comme body (`--notes-from-tag`), avec
      #   un en-tête « Installation » standard.
      # Plus JAMAIS de body hardcodé qui écrase les notes détaillées.
      - name: Attach APK to release (create if missing, preserve existing body)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          APK_FILE: edukraft-${{ steps.version.outputs.VERSION }}.apk
        run: |
          set -euo pipefail
          echo "Recherche d'une release existante pour le tag $VERSION..."
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "✓ Release $VERSION existe déjà — attachement de l'APK sans modifier le body."
            gh release upload "$VERSION" "$APK_FILE" --repo "$GITHUB_REPOSITORY" --clobber
            echo "✓ APK attaché à la release existante $VERSION (body préservé)."
          else
            echo "✗ Release $VERSION introuvable — création avec notes depuis le tag."
            # Construire un body avec un en-tête Installation + le message du commit de tag
            TAG_COMMIT_MSG=$(git log -1 --pretty=%B HEAD)
            {
              echo "# EduKraft $VERSION"
              echo ""
              echo "## Installation"
              echo "1. Téléchargez le fichier APK ci-dessous"
              echo "2. Ouvrez-le sur votre téléphone Android"
              echo '3. Autorisez "Sources inconnues" si demandé'
              echo "4. Ouvrez EduKraft"
              echo ""
              echo "## Notes de version"
              echo ""
              echo "$TAG_COMMIT_MSG"
            } > /tmp/release-body.md
            gh release create "$VERSION" "$APK_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "EduKraft $VERSION" \
              --notes-file /tmp/release-body.md
            echo "✓ Release $VERSION créée avec notes depuis le commit de tag."
          fi
