# Build APK + Publish to GitHub Releases — SANS EAS
# Déclenché sur tag v* ou manuellement (workflow_dispatch).
#
# Ce workflow :
#   1. Génère le projet natif android/ (expo prebuild --clean)
#   2. Injecte le keystore STABLE versionné dans android-signing/
#      (signature identique à chaque build -> mises à jour sans désinstallation)
#   3. Compile l'APK release avec Gradle directement sur le runner
#   4. Crée une GitHub Release avec l'APK en pièce jointe
#
# ✅ AUCUN secret requis (ni EXPO_TOKEN, ni keystore externe).
#    Le keystore de test est versionné dans android-signing/ — à remplacer par
#    un keystore privé pour une publication Play Store (voir docs/DEPLOYMENT-V1.md).
#
# Une fois le workflow terminé, l'APK est téléchargeable depuis :
#   https://github.com/koffi-13/edukraft/releases

name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v1.1.1)'
        required: true
        default: 'v1.1.1'
  push:
    tags:
      - 'v*'

# Permissions nécessaires pour créer une GitHub Release
permissions:
  contents: write

jobs:
  build:
    name: Build APK (Gradle direct) and Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android (clean)
        run: npx expo prebuild --platform android --clean --no-install

      # Le template Expo signe le build release avec signingConfigs.debug
      # (storeFile android/app/debug.keystore, password 'android',
      #  alias 'androiddebugkey'). On écrase ce fichier par notre keystore
      # stable : signature IDENTIQUE à chaque build -> les APK se mettent à
      # jour par-dessus les versions précédentes sans désinstallation.
      - name: Inject stable signing keystore
        run: |
          cp android-signing/edukraft-release.keystore android/app/debug.keystore
          echo "Keystore injecte (SHA-256 du certificat) :"
          keytool -list -v -keystore android/app/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" || { echo "::error::APK non signé !"; exit 1; }
          echo "APK signé, signature vérifiée."

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "edukraft-${{ steps.version.outputs.VERSION }}.apk"
          ls -lh edukraft-*.apk

      - name: Upload APK (artifact de secours)
        uses: actions/upload-artifact@v4
        with:
          name: edukraft-${{ steps.version.outputs.VERSION }}
          path: edukraft-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: EduKraft ${{ steps.version.outputs.VERSION }}
          body: |
            # EduKraft ${{ steps.version.outputs.VERSION }}

            ## Installation
            1. Téléchargez le fichier APK ci-dessous
            2. Ouvrez-le sur votre téléphone Android
            3. Autorisez "Sources inconnues" si demandé
            4. Ouvrez EduKraft

            ## Nouveautés v1.1.7
            - **Persistance blindée (offline-first)** : à la réouverture de
              l'app, votre tableau de bord s'affiche directement avec toutes
              vos données — jusqu'à ce que vous vous déconnectiez
              volontairement. Un filet de sécurité recrée le profil depuis
              votre compte même si la base locale rencontre un problème.
            - **Synchronisation au retour du réseau** : dès la reconnexion
              (ou le retour au premier plan), vos données locales partent
              immédiatement vers votre compte en ligne — plus d'attente.
            - **Chargement des mises à jour** : l'app récupère
              automatiquement les activités effectuées sur vos autres
              appareils (fusion sans perte) et le catalogue de cours à jour.
            - **Nouveaux cours sans mise à jour de l'APK** : les formations
              publiées sur le serveur apparaissent automatiquement dans
              l'app (et restent consultables hors ligne grâce au cache).
            - **Diagnostics du stockage** : Profil → Synchronisation →
              « Diagnostics du stockage » affiche l'état de chaque couche
              de persistance (utile en cas de souci).
          files: edukraft-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
