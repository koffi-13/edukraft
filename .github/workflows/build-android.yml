name: Build Android APK

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON modules
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'src/content/modules';
            fs.readdirSync(dir).filter(f => f.endsWith('.json')).forEach(f => {
              const p = path.join(dir, f);
              try { JSON.parse(fs.readFileSync(p, 'utf8')); console.log('✅ ' + f); }
              catch(e) { console.error('❌ ' + f + ': ' + e.message); process.exit(1); }
            });
          "

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: 50
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (development)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: eas build --platform android --profile development --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (preview)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}